# Daily email digest. Inert until you turn it on — see docs/15-cd-and-digest.md:
#   1. Secrets:   DATABASE_URL, JWT_SECRET, RESEND_API_KEY, MAIL_FROM
#   2. Variables: DIGEST_ENABLED = true
#
# Verify a Resend domain first. Until you do, the free tier only delivers to your own
# address and every other recipient is a bounce — which is how a sending domain gets
# reputation-scored into the spam folder.
#
# The scheduler lives here rather than as a setInterval inside the web server: an
# interval fires once per running instance, so two servers would email everyone twice.
name: Daily digest

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC daily. GitHub cron is always UTC.
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  digest:
    if: vars.DIGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node jobs/digest.js
